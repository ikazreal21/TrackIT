<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackIT - Health Observatory</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <div class="app-container">
        <header class="topbar">
            <div class="brand">
                <div class="avatar"><img src="/static/logo.png" alt="TrackIT"></div>
                <span class="pill">Local</span>
            </div>
            <div class="controls">
                <div class="range-selector" id="rangeSelector">
                    <button class="range-btn" data-range="day">Day</button>
                    <button class="range-btn active" data-range="week">Week</button>
                    <button class="range-btn" data-range="month">Month</button>
                    <button class="range-btn" data-range="custom">Custom</button>
                </div>
                <div class="date-picker-group" id="datePickerGroup" hidden>
                    <input type="date" id="startDate" class="date-input">
                    <span class="date-separator">to</span>
                    <input type="date" id="endDate" class="date-input">
                </div>
            </div>
        </header>

        <p class="dateline"><span id="dateLine">Today</span><span class="dot-sep"></span><span id="recordStats"></span></p>

        <section class="card balance">
            <div class="balance-rings" id="balanceRings"></div>
            <div class="balance-stats">
                <div class="balance-status" id="balanceStatus">No data yet</div>
                <div class="balance-sub">Today at a glance</div>
                <div class="mini-stat"><span class="mdot" style="background:#2FE0A8"></span>Steps<span class="mval" id="miniSteps">--</span></div>
                <div class="mini-stat"><span class="mdot" style="background:#F6915A"></span>Active kcal<span class="mval" id="miniCal">--</span></div>
                <div class="mini-stat"><span class="mdot" style="background:#7C8CF8"></span>Avg HR<span class="mval" id="miniHr">--</span></div>
            </div>
        </section>

        <section class="scores">
            <div class="card score-card" id="sleepCard">
                <div class="score-title">Sleep <span class="chev">›</span></div>
                <div class="gauge-wrap" id="sleepGauge"></div>
                <div class="score-status" id="sleepStatus">No data</div>
                <p class="score-insight" id="sleepInsight"></p>
            </div>
            <div class="card score-card" id="strainCard">
                <div class="score-title">Strain <span class="chev">›</span></div>
                <div class="gauge-wrap" id="strainGauge"></div>
                <div class="score-status" id="strainStatus">No data</div>
                <p class="score-insight" id="strainInsight"></p>
            </div>
        </section>

        <section class="card panel wide">
            <div class="panel-head"><h2>Sleep Analysis</h2><span class="panel-sub" id="sleepSpan"></span></div>
            <div id="hypno"></div>
            <div class="axis" id="hypnoAxis"></div>
            <div id="stageRows"></div>
        </section>

        <section class="card panel wide">
            <div class="panel-head"><h2>Heart Rate Trend</h2></div>
            <div class="chart-body tall"><canvas id="hrChart"></canvas></div>
        </section>

        <section class="grid2">
            <div class="card panel">
                <div class="panel-head"><h2>Steps &amp; Distance</h2></div>
                <div class="chart-body"><canvas id="stepsChart"></canvas></div>
            </div>
            <div class="card panel">
                <div class="panel-head"><h2>Calories</h2></div>
                <div class="chart-body"><canvas id="caloriesChart"></canvas></div>
            </div>
            <div class="card panel">
                <div class="panel-head"><h2>Weight</h2></div>
                <div class="chart-body"><canvas id="weightChart"></canvas></div>
            </div>
            <div class="card panel">
                <div class="panel-head"><h2>Data Distribution</h2></div>
                <div class="chart-body"><canvas id="distributionChart"></canvas></div>
            </div>
        </section>

        <section class="card panel wide">
            <div class="panel-head"><h2>Recent Records</h2><span class="panel-sub" id="recordCount"></span></div>
            <div class="records-list" id="recordsList"></div>
        </section>

        <footer class="app-footer">
            <a href="/docs">API Docs</a>
            <a href="/bare">Simple View</a>
            <a href="/health">Health Check</a>
        </footer>
    </div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
